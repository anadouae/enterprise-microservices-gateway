# Activated via SPRING_PROFILES_ACTIVE=postgres (docker-compose profile "postgres"/"full").
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/query}
    username: ${SPRING_DATASOURCE_USERNAME:query}
    password: ${SPRING_DATASOURCE_PASSWORD:query}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
